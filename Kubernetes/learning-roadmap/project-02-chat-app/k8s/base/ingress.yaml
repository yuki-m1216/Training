apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ingress
  labels:
    app: chat
  annotations:
    # WebSocket用の設定
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket接続のアップグレードを有効化
    nginx.ingress.kubernetes.io/websocket-services: backend
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
        # Backend API
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 3000
        # Backend WebSocket
        - path: /socket.io
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 3000
        # Backend Health
        - path: /health
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 3000
        # Frontend
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 3001
