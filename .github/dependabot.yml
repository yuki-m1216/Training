version: 2
updates:
  # Root npm project
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Kubernetes projects
  - package-ecosystem: "npm"
    directory: "/Kubernetes/hello-k8s"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/Kubernetes/learning-roadmap/project-01-weather-app/backend"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/Kubernetes/learning-roadmap/project-02-chat-app/backend"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/Kubernetes/learning-roadmap/project-02-chat-app/frontend"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/Kubernetes/next-nest-k8s-app/backend"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/Kubernetes/next-nest-k8s-app/frontend"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  # Terraform projects (npm)
  - package-ecosystem: "npm"
    directory: "/Terraform/AWS/Resources/APIGateway/synthetics_test_api"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/Terraform/AWS/Resources/RAG/fe/src"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  # Python/Poetry projects (pip ecosystem for lock file updates)
  - package-ecosystem: "pip"
    directory: "/Terraform/AWS/Resources/RAG/be/src/embed_doc"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/Terraform/AWS/Resources/RAG/be/src/answer_user_query"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/Terraform/AWS/Resources/RAG/be/src/vector_database"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
