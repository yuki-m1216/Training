name: Security Alert Notification

on:
  # Daily schedule (JST 10:00 = UTC 01:00)
  schedule:
    - cron: "0 1 * * *"

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Check for open security alerts
        id: check
        env:
          # GITHUB_TOKEN does not have access to Dependabot alerts API.
          # A PAT with "Dependabot alerts:read" (fine-grained) or
          # "security_events" (classic) scope is required.
          GH_TOKEN: ${{ secrets.PAT_SECURITY }}
        run: |
          # Get open Dependabot alerts only (with pagination support)
          # Retry up to 3 attempts for transient errors (502, 503, etc.)
          max_retries=3
          retry_delay=10
          raw_response=""
          api_error=""

          for attempt in $(seq 1 $max_retries); do
            error_output=$(mktemp)
            raw_response=$(gh api "repos/${{ github.repository }}/dependabot/alerts?state=open" \
              --paginate 2>"$error_output") && api_success=true || api_success=false
            api_error=$(cat "$error_output")
            rm -f "$error_output"

            # Log API error if any (sanitize to avoid workflow command injection)
            if [ -n "$api_error" ]; then
              sanitized_api_error=${api_error//$'\r'/}
              sanitized_api_error=${sanitized_api_error//$'\n'/\\n}
              echo "API stderr (attempt ${attempt}/${max_retries}): $sanitized_api_error"
            fi

            # If the API call succeeded and response is valid JSON (single or multiple documents), break out of retry loop
            if [ "$api_success" = true ] && [ -n "$raw_response" ] && echo "$raw_response" | jq -s '.' > /dev/null 2>&1; then
              break
            fi

            # Fail fast on non-transient errors (4xx) - only retry on 5xx or network errors
            if [ "$api_success" = false ] && echo "$api_error" | grep -qE 'HTTP [45][0-9]{2}'; then
              http_status=$(echo "$api_error" | grep -oE 'HTTP [0-9]{3}' | head -1 | grep -oE '[0-9]{3}')
              if [ -n "$http_status" ] && [ "$http_status" -lt 500 ]; then
                echo "::error::Non-transient API error (HTTP ${http_status}). Check PAT_SECURITY secret and permissions."
                exit 1
              fi
            fi

            # On last attempt, don't sleep
            if [ "$attempt" -lt "$max_retries" ]; then
              echo "Retrying in ${retry_delay}s..."
              sleep "$retry_delay"
              retry_delay=$((retry_delay * 2))
            fi
          done

          # Check if response is empty, error, or valid
          if [ "$api_success" = false ] || [ -z "$raw_response" ]; then
            if [ -n "$api_error" ]; then
              sanitized_last_error=$(printf '%s' "$api_error" | tr -d '\r' | tr '\n' ' ')
              echo "::error::Dependabot alerts API request failed after ${max_retries} attempts."
              printf 'Last error: %s\n' "$sanitized_last_error"
            else
              echo "::error::Empty response from Dependabot alerts API after ${max_retries} attempts. Check PAT_SECURITY secret."
            fi
            exit 1
          elif echo "$raw_response" | jq -e 'type == "object" and has("message")' > /dev/null 2>&1; then
            echo "::error::API error: $(echo "$raw_response" | jq -r '.message')"
            exit 1
          fi

          # --paginate may return multiple JSON arrays concatenated; jq -s merges them
          all_alerts=$(echo "$raw_response" | jq -s 'add // []' 2>/dev/null) || {
            echo "::error::Failed to parse Dependabot alerts API response after ${max_retries} attempts"
            exit 1
          }

          # Ensure the merged result is an array before counting alerts
          if ! echo "$all_alerts" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "::error::Unexpected Dependabot alerts API response format (expected JSON array)"
            exit 1
          fi

          # Filter: only include alerts that have a patched version available
          alerts=$(echo "$all_alerts" | jq '[.[] | select(.security_vulnerability.first_patched_version != null)]')
          no_fix_count=$(echo "$all_alerts" | jq '[.[] | select(.security_vulnerability.first_patched_version == null)] | length')

          actionable_count=$(echo "$alerts" | jq -r 'length')
          total_count=$(echo "$all_alerts" | jq -r 'length')
          echo "Found $actionable_count actionable alerts out of $total_count total (${no_fix_count} have no fix available)"

          # Build fingerprint from alert numbers for content-based dedup
          fingerprint=$(echo "$alerts" | jq -r '[.[].number] | sort | join(",")' | sha256sum | cut -d' ' -f1)

          if [ "$actionable_count" -gt 0 ]; then
            echo "has_alerts=true" >> $GITHUB_OUTPUT
            echo "actionable_count=$actionable_count" >> $GITHUB_OUTPUT
            echo "no_fix_count=$no_fix_count" >> $GITHUB_OUTPUT
            echo "fingerprint=$fingerprint" >> $GITHUB_OUTPUT
            echo "$alerts" > /tmp/alerts.json
          else
            echo "has_alerts=false" >> $GITHUB_OUTPUT
            if [ "$no_fix_count" -gt 0 ]; then
              echo "::notice::${no_fix_count} alerts have no fix available and were excluded"
            fi
          fi

      - name: Check for existing open issue
        if: steps.check.outputs.has_alerts == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list \
            --repo ${{ github.repository }} \
            --label "security" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "existing_issue=$existing" >> $GITHUB_OUTPUT
            echo "Found existing security issue: #$existing"
          else
            echo "No existing security issue found"
          fi

      - name: Create security issue
        if: steps.check.outputs.has_alerts == 'true' && steps.existing.outputs.existing_issue == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          alerts=$(cat /tmp/alerts.json)
          current_date=$(date '+%Y-%m-%d %H:%M:%S %Z')

          # Group alerts by ecosystem
          npm_alerts=$(echo "$alerts" | jq '[.[] | select(.dependency.package.ecosystem == "npm")]')
          pip_alerts=$(echo "$alerts" | jq '[.[] | select(.dependency.package.ecosystem == "pip")]')
          actions_alerts=$(echo "$alerts" | jq '[.[] | select(.dependency.package.ecosystem == "github_actions")]')

          # Build issue body
          {
            echo "## セキュリティアラート検出"
            echo ""
            echo "**検出日時**: ${current_date}"
            echo "**アラート数**: ${{ steps.check.outputs.actionable_count }}件（修正可能）"
            no_fix=${{ steps.check.outputs.no_fix_count }}
            if [ "$no_fix" -gt 0 ]; then
              echo "**修正版なし**: ${no_fix}件（修正版リリース待ち）"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## アラート詳細"
            echo ""

            # npm alerts
            npm_count=$(echo "$npm_alerts" | jq -r 'length')
            if [ "$npm_count" -gt 0 ]; then
              echo "### npm (${npm_count}件)"
              echo ""
              echo "$npm_alerts" | jq -r '.[] | "- **\(.security_advisory.cve_id // "N/A")** - \(.dependency.package.name) (\(.security_advisory.severity))\n  - 影響: \(.security_vulnerability.vulnerable_version_range)\n  - 修正版: \(.security_vulnerability.first_patched_version.identifier // "N/A")\n  - ファイル: \(.dependency.manifest_path)"'
              echo ""
            fi

            # pip alerts
            pip_count=$(echo "$pip_alerts" | jq -r 'length')
            if [ "$pip_count" -gt 0 ]; then
              echo "### pip/Poetry (${pip_count}件)"
              echo ""
              echo "$pip_alerts" | jq -r '.[] | "- **\(.security_advisory.cve_id // "N/A")** - \(.dependency.package.name) (\(.security_advisory.severity))\n  - 影響: \(.security_vulnerability.vulnerable_version_range)\n  - 修正版: \(.security_vulnerability.first_patched_version.identifier // "N/A")\n  - ファイル: \(.dependency.manifest_path)"'
              echo ""
            fi

            # GitHub Actions alerts
            actions_count=$(echo "$actions_alerts" | jq -r 'length')
            if [ "$actions_count" -gt 0 ]; then
              echo "### GitHub Actions (${actions_count}件)"
              echo ""
              echo "$actions_alerts" | jq -r '.[] | "- **\(.security_advisory.cve_id // "N/A")** - \(.dependency.package.name) (\(.security_advisory.severity))\n  - 影響: \(.security_vulnerability.vulnerable_version_range)\n  - 修正版: \(.security_vulnerability.first_patched_version.identifier // "N/A")\n  - ファイル: \(.dependency.manifest_path)"'
              echo ""
            fi

            echo "---"
            echo ""
            echo "## 対応方法"
            echo ""
            echo "ローカルでClaude Codeを使って修正:"
            echo ""
            echo '```bash'
            echo 'claude "このIssueのセキュリティアラートを修正してPR作成して"'
            echo '```'
          } > /tmp/issue_body.md

          gh issue create \
            --repo ${{ github.repository }} \
            --title "🔒 セキュリティアラート: ${{ steps.check.outputs.actionable_count }}件の脆弱性を検出" \
            --body-file /tmp/issue_body.md \
            --label "security"

      - name: Update existing issue
        if: steps.check.outputs.has_alerts == 'true' && steps.existing.outputs.existing_issue != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_number=${{ steps.existing.outputs.existing_issue }}
          current_fingerprint=${{ steps.check.outputs.fingerprint }}
          actionable_count=${{ steps.check.outputs.actionable_count }}

          # Extract fingerprint from the last bot comment's HTML marker
          last_fingerprint=$(gh api "repos/${{ github.repository }}/issues/${issue_number}/comments" \
            --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | .body] | last // ""' \
            | grep -oP '<!-- fingerprint:\K[a-f0-9]+' || echo "")

          if [ "$last_fingerprint" = "$current_fingerprint" ]; then
            echo "Alert fingerprint unchanged. Skipping comment."
            exit 0
          fi

          current_date=$(date '+%Y-%m-%d %H:%M:%S %Z')
          no_fix=${{ steps.check.outputs.no_fix_count }}
          no_fix_note=""
          if [ "$no_fix" -gt 0 ]; then
            no_fix_note="（他 ${no_fix}件は修正版なし）"
          fi

          comment_body="⚠️ **定期チェック**: 現在 ${actionable_count}件の修正可能なセキュリティアラートが未対応です。${no_fix_note}（最終確認: ${current_date}）
          <!-- fingerprint:${current_fingerprint} -->"

          gh issue comment "${issue_number}" \
            --repo ${{ github.repository }} \
            --body "$comment_body"
